    h+=`<div class="ed" data-e="${e.i}" data-s="${s}"><div class="r2"><select data-f="m"><option value="">เหรียญรางวัล</option>${MD.map(x=>`<option ${r.m==x?'selected':''}>${x}</option>`).join('')}</select><input data-f="sc" inputmode="decimal" placeholder="คะแนน" value="${esc(r.sc)}"></div><input data-f="r" placeholder="อันดับ / หมายเหตุ" value="${esc(r.r)}"><label class="ck"><input type="checkbox" data-f="a" ${r.a?'checked':''}> ได้เป็นตัวแทนแข่งต่อ</label></div>`;
  }else if(r.m||r.sc||r.r||r.a){
    h+=`<div class="rt">${mb(r.m)}${r.sc?`<span class="sc">${esc(r.sc)} คะแนน</span>`:''}${r.r?`<span class="sc">${esc(r.r)}</span>`:''}${r.a?'<span class="b g">🏆 ตัวแทนแข่งต่อ</span>':''}</div>`;
  }
  if(MODE=='names'){
    h+=allowN(s)?nameEd(e,t):`<div class="nm">🧑‍🎓 ${esc(t[1].join(', '))}</div><div class="nm">👩‍🏫 ${esc(t[2].join(', '))}</div><div class="nm">🔒 แก้ไขได้เฉพาะโรงเรียนของตนเอง</div>`;
  }else h+=`<div class="nm">🧑‍🎓 ${esc(t[1].join(', '))}</div><div class="nm">👩‍🏫 ${esc(t[2].join(', '))}</div>`;
  return h+'</div>';
}
function card(e){
  const mine=ME!==''&&e.tm.includes(+ME),got=e.tm.some(s=>res(e,s).m);
  return `<details class="c ${mine?'my':''}" style="--h:${HUE(e.sh)}" data-id="${e.i}" ${open.has(e.i)?'open':''}><summary><div class="t">${ICON[e.sh]||'🏅'} ${esc(e.t)}${e.sb?' · '+esc(e.sb):''}</div>
<div class="m"><span class="b sub">${esc(e.sh)}</span><span class="b">${esc(e.lv)}</span><span class="b n">👥 ${e.tm.length} ทีม</span>${e.nt?`<span class="b w">${esc(e.nt)}</span>`:''}${mine?'<span class="b my">⭐ โรงเรียนฉัน</span>':''}${got?'<span class="b g">✅ ประกาศผลแล้ว</span>':''}</div>
<div class="s">⏰ ${esc(e.wh||'ยังไม่ระบุเวลาและสถานที่')}</div></summary>
<div class="tl">${e.tt.length?e.tt.map(t=>teamRow(e,t)).join(''):'<div class="s">ไม่มีโรงเรียนส่งแข่ง</div>'}</div></details>`;
}
function evList(){
  const L=vis();let h='',last='';
  L.forEach(e=>{if(e.dt!==last){last=e.dt;h+=`<div class="dh">📅 ${esc(e.dt)}</div>`}h+=card(e)});
  return `<div class="s" style="margin-bottom:6px">แสดง ${L.length} จาก ${EV.length} รายการ</div>`+(h||'<div class="em">ไม่พบรายการ</div>');
}
function listView(){
  const dates=[...new Map(EV.map(e=>[e.dt,e.dk])).entries()].sort((a,b)=>a[1]-b[1]).map(x=>x[0]);
  const op=(arr,v)=>arr.map(x=>`<option ${x==v?'selected':''}>${esc(x)}</option>`).join('');
  return `<div class="fl"><input class="q" id="fq" placeholder="🔎 ค้นหารายการ โรงเรียน ชื่อนักเรียน หรือครู" value="${esc(F.q)}">
<select data-k="d"><option value="">ทุกวัน</option>${op(dates,F.d)}</select><select data-k="s"><option value="">ทุกกลุ่มสาระ</option>${op(SHS,F.s)}</select>
<select data-k="l"><option value="">ทุกระดับ</option>${op(Object.keys(LV),F.l)}</select>
<div><label class="ck"><input type="checkbox" data-k="my" ${F.my?'checked':''}> เฉพาะของโรงเรียนฉัน</label><label class="ck"><input type="checkbox" data-k="rs" ${F.rs?'checked':''}> เฉพาะที่มีผลแล้ว</label></div></div><div id="L">${evList()}</div>`;
}
function stats(){
  const st=SC.map(()=>({n:0,t:0,s:0,b:0,p:0,a:0}));
  EV.forEach(e=>e.tm.forEach(s=>{const x=st[s],r=res(e,s);x.n++;if(r.m=='ทอง')x.t++;else if(r.m=='เงิน')x.s++;else if(r.m=='ทองแดง')x.b++;else if(r.m=='เข้าร่วม')x.p++;if(r.a)x.a++}));
  return st;
}
function sumView(){
  const st=stats(),rows=SC.map((n,i)=>({i,n,x:st[i]})).sort((a,b)=>b.x.t-a.x.t||b.x.s-a.x.s||b.x.b-a.x.b||b.x.n-a.x.n);
  const done=EV.filter(e=>e.tm.some(s=>res(e,s).m)).length;
  return `<div class="kp"><div><b>${EV.length}</b><span>รายการทั้งหมด</span></div><div><b>${done}</b><span>ประกาศผลแล้ว</span></div><div><b>${SC.length}</b><span>โรงเรียน</span></div></div>
<div class="card tw"><table><tr><th>โรงเรียน</th><th>ส่ง</th><th>🥇</th><th>🥈</th><th>🥉</th><th>🎖️</th><th>🏆</th></tr>${rows.map(r=>`<tr class="${String(r.i)===ME?'me':''}"><td><i class="dot" style="--h:${SHUE(r.i)}"></i>${esc(r.n)}</td><td>${r.x.n}</td><td>${r.x.t}</td><td>${r.x.s}</td><td>${r.x.b}</td><td>${r.x.p}</td><td>${r.x.a}</td></tr>`).join('')}</table></div>
<div class="s">🥇 ทอง · 🥈 เงิน · 🥉 ทองแดง · 🎖️ เข้าร่วม · 🏆 ได้เป็นตัวแทนแข่งต่อ</div>`;
}
function schView(){
  const opts=SC.map((n,i)=>`<option value="${i}" ${String(i)===ME?'selected':''}>${esc(n)}</option>`).join('');
  let h=`<div class="fl"><select class="q" id="ss"><option value="">เลือกโรงเรียน</option>${opts}</select></div>`;
  if(ME==='')return h+'<div class="em">เลือกโรงเรียนเพื่อดูสรุปผลการแข่งขันของโรงเรียน</div>';
  const mine=EV.filter(e=>e.tm.includes(+ME)).sort((a,b)=>a.dk-b.dk||a.tn-b.tn||a.i-b.i);
  const c={ทอง:0,เงิน:0,ทองแดง:0,เข้าร่วม:0};mine.forEach(e=>{const m=res(e,+ME).m;if(m)c[m]++});
  h+=`<div class="card"><div class="t">🏫 ${esc(SC[+ME])}</div><div class="s">ส่งแข่ง ${mine.length} รายการ · 🥇 ${c['ทอง']} · 🥈 ${c['เงิน']} · 🥉 ${c['ทองแดง']} · 🎖️ ${c['เข้าร่วม']}</div></div>`;
  h+=`<div class="card tw"><table class="st"><tr><th>ที่</th><th>รายการแข่งขัน</th><th>คะแนน</th><th>ระดับ</th><th>อันดับ</th></tr>${mine.map((e,k)=>{const r=res(e,+ME);return `<tr><td>${k+1}</td><td>${ICON[e.sh]||'🏅'} ${esc(e.t)}${e.sb?' · '+esc(e.sb):''}</td><td>${r.sc?esc(r.sc):'-'}</td><td>${esc(e.lv)}</td><td>${r.m||r.r?(r.m?mb(r.m):'')+(r.r?' '+esc(r.r):''):'-'}</td></tr>`}).join('')}</table></div>`;
  return h;
}
function acct(){
  if(!U.signed&&!U.edit&&!U.owner)return `<div class="acct"><div><b>👤 ผู้ชมทั่วไป</b><div class="s">ดูตารางและผลได้อย่างเดียว ผู้ดูแลและครูที่ได้รับสิทธิ์ ต้องลงชื่อเข้าใช้เพื่อบันทึกผลหรือแก้ไขชื่อ หลังลงชื่อเข้าใช้แล้ว ให้เปิดลิงก์หน้านี้อีกครั้ง</div></div><a class="btn" href="https://claude.ai/login" target="_blank" rel="noopener">🔑 ลงชื่อเข้าใช้</a></div>`;
  const role=U.owner?'ผู้ดูแลระบบ':U.edit?'ผู้ช่วยดูแล (แก้ไขชื่อของโรงเรียนตนเอง)':'ดูได้อย่างเดียว';
  let h=`<div class="acct v"><div><b>✅ ลงชื่อเข้าใช้แล้ว: ${esc(U.name||'ผู้ใช้')}</b><div class="s">สิทธิ์: ${role}</div></div>`;
  if(U.edit||U.owner){
    h+=`<div class="mn">${U.owner?`<button class="${MODE=='res'?'on':'s2'}" data-mode="res">📝 บันทึกผล</button>`:''}<button class="${MODE=='names'?'on':'s2'}" data-mode="names">✏️ แก้ไขชื่อ-สกุล</button><button id="pub" ${AR&&dirty?'':'disabled'}>☁️ เผยแพร่</button></div><div class="s" id="msg">${dirty?'มีการแก้ไขที่ยังไม่ได้เผยแพร่ (เก็บร่างไว้ในเครื่องนี้) กด “เผยแพร่” เพื่อให้ทุกโรงเรียนเห็น':'ข้อมูลตรงกับที่เผยแพร่แล้ว'}${MODE=='names'&&!U.owner&&ME===''?' · เลือกโรงเรียนของฉันก่อนจึงจะแก้ไขได้':''}</div>`;
  }
  return h+'</div>';
}
function render(){
  const opts=SC.map((n,i)=>`<option value="${i}" ${String(i)===ME?'selected':''}>${esc(n)}</option>`).join('');
  $('#root').innerHTML=`<header><div class="ic">🏅🎨🎵🔬📚</div><h1>สรุปผลการแข่งขันศิลปหัตถกรรมนักเรียน ครั้งที่ 74</h1><p>ปีการศึกษา 2569 · ดูตารางแข่งขันและผลของทุกโรงเรียน</p><select id="me"><option value="">⭐ เลือกโรงเรียนของฉัน</option>${opts}</select></header><main>${acct()}<div class="tabs"><button data-t="list" class="${tab=='list'?'on':''}">📋 ตารางและผล</button><button data-t="sum" class="${tab=='sum'?'on':''}">🏆 สรุปรวม</button><button data-t="sch" class="${tab=='sch'?'on':''}">🏫 ผลรายโรงเรียน</button></div>${tab=='list'?listView():tab=='sum'?sumView():schView()}<datalist id="pfx">${PFX.map(x=>`<option value="${x}">`).join('')}</datalist></main>`;
}
function setR(t,v){
  const p=t.closest('.ed'),e=p.dataset.e,s=p.dataset.s;
  if(!RS[e])RS[e]={};
  if(!RS[e][s])RS[e][s]={};
  RS[e][s][t.dataset.f]=v;draft();
}
function teamOf(p){const e=EV[+p.dataset.e];return e.tt.find(t=>t[0]==+p.dataset.s)}
function edKey(p){return p.dataset.e+'_'+p.dataset.s}
function setN(p){const t=teamOf(p);ED[edKey(p)]=[t[1],t[2]];draft()}
async function pub(){
  const m=$('#msg'),clean={};
  for(const e in RS)for(const s in RS[e]){const r=RS[e][s];if(r.m||r.sc||r.r||r.a){if(!clean[e])clean[e]={};clean[e][s]=r}}
  m.textContent='กำลังเผยแพร่...';
  try{
    const doc=buildDoc(clean);
    sv('sk74draft2',null);
    await AR.publish(doc);
  }catch(err){
    draft();
    m.textContent=(err&&err.code=='conflict')?'มีผู้ดูแลคนอื่นเผยแพร่ก่อน กรุณาโหลดหน้าใหม่ ร่างของคุณยังอยู่ในเครื่องนี้':'เผยแพร่ไม่สำเร็จ'+(err&&err.code?' ('+err.code+')':'');
  }
}
const R=$('#root');
R.addEventListener('input',e=>{
  const t=e.target;
  if(t.id=='fq'){F.q=t.value.trim();const L=$('#L');if(L)L.innerHTML=evList();return}
  if(t.dataset.p){
    const row=t.closest('.pr'),ne=t.closest('.ne'),tm=teamOf(ne);
    const v=[...row.querySelectorAll('input')].map(x=>x.value.trim());
    tm[+row.dataset.k][+row.dataset.j]=v[0]+v[1]+(v[2]?' '+v[2]:'');
    setN(ne);return;
  }
  if(t.dataset.f&&t.type!='checkbox'&&t.tagName!='SELECT')setR(t,t.value);
});
R.addEventListener('change',e=>{
  const t=e.target;
  if(t.id=='me'||t.id=='ss'){ME=t.value;sv('sk74me',ME);render();return}
  if(t.dataset.k){F[t.dataset.k]=t.type=='checkbox'?t.checked:t.value;render();return}
  if(t.dataset.f&&(t.type=='checkbox'||t.tagName=='SELECT')){setR(t,t.type=='checkbox'?t.checked:t.value);render()}
});
R.addEventListener('toggle',e=>{const d=e.target;if(d.dataset&&d.dataset.id){const i=+d.dataset.id;d.open?open.add(i):open.delete(i)}},true);
R.addEventListener('click',e=>{
  const t=e.target;
  if(t.dataset.t){tab=t.dataset.t;render();return}
  if(t.dataset.mode){MODE=MODE==t.dataset.mode?'':t.dataset.mode;tab='list';render();return}
  if(t.id=='pub'){pub();return}
  const ne=t.closest('.ne');
  if(ne&&t.dataset.add){teamOf(ne)[+t.dataset.add].push('');setN(ne);render();return}
  if(ne&&t.dataset.del){const row=t.closest('.pr');teamOf(ne)[+row.dataset.k].splice(+row.dataset.j,1);setN(ne);render()}
});
render();
(async()=>{
  try{
    if(!window.claude)return;
    const u=await claude.use('user');
    if(u){
      const me=await u.me();
      U.owner=!!(await u.isOwner());U.edit=U.owner||!!(await u.canEdit());
      U.name=me.name||'';U.signed=!!(me.id||me.name)||U.edit;
    }
    AR=await claude.use('artifact');
    if(U.edit){
      const dr=ld('sk74draft2',null);
      if(dr){
        if(U.owner&&dr.rs)RS=dr.rs;
        ED=dr.ed||{};
        for(const k in ED){const[a,b]=k.split('_'),ev=EV[+a],t=ev&&ev.tt.find(x=>x[0]==+b);if(t&&allowN(b)){t[1]=ED[k][0];t[2]=ED[k][1]}else delete ED[k]}
        dirty=!!(Object.keys(ED).length||(U.owner&&dr.rs));
      }
    }
    render();
  }catch(err){}
})();
</script></body></html>
